<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLFox Music — Треки</title>
  <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <header>
    <h1>🎧 SLFox Music</h1>
    <nav>
      <a href="/tracks.html">Треки</a>
      <a href="/authors.html">Авторы</a>
      <a href="/upload.html">Загрузка</a>
      <a href="/index.html" onclick="logout()">Выход</a>
    </nav>
  </header>

  <main class="single-col">
    <section class="card">
      <div class="tracks-layout">
        <div>
          <h2>Лента треков</h2>
          <div id="tracks"></div>
        </div>
        <aside class="queue-panel">
          <h3>Очередь воспроизведения</h3>
          <div id="queueList"></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="playerToolbar">
    <div class="player-meta">
      <strong id="playingNow">Ничего не играет</strong>
      <small id="playingHint">Выберите трек из ленты или очереди</small>
    </div>
    <div class="player-controls">
      <button id="prevBtn" class="icon-btn" title="Предыдущий">⏮</button>
      <button id="playPauseBtn" class="icon-btn" title="Пауза/Пуск">⏯</button>
      <button id="nextBtn" class="icon-btn" title="Следующий">⏭</button>
    </div>
    <audio id="audioPlayer" controls preload="metadata"></audio>
  </div>

  <div id="toast"></div>
  <script src="/common.js"></script>
  <script src="/tracks.js"></script>
</body>
</html>
