<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLFox Music — Восстановление пароля</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <main class="single-col">
    <section class="card">
      <h2>Восстановление пароля</h2>
      <input id="resetEmail" placeholder="Email" />
      <button onclick="forgotPasswordPopup()">Запросить reset token</button>
      <input id="resetToken" placeholder="Reset token" />
      <input id="newPassword" type="password" placeholder="Новый пароль" />
      <button onclick="resetPasswordPopup()">Сменить пароль</button>
    </section>
  </main>

  <div id="toast"></div>
  <script src="/common.js"></script>
  <script src="/password-reset.js"></script>
</body>
</html>
