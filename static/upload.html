<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLFox Music — Загрузка</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>🎧 SLFox Music</h1>
    <nav>
      <a href="/tracks.html">Треки</a>
      <a href="/authors.html">Авторы</a>
      <a href="/upload.html">Загрузка</a>
      <a href="/index.html" onclick="logout()">Выход</a>
    </nav>
  </header>

  <main class="single-col">
    <section class="card">
      <h2>Загрузка трека</h2>
      <input id="trackTitle" placeholder="Название" />
      <input id="trackArtist" placeholder="Исполнитель" />
      <input id="trackFile" type="file" accept="audio/*" />
      <button onclick="uploadTrack()">Залить музыку</button>
    </section>
  </main>

  <div id="toast"></div>
  <script src="/common.js"></script>
  <script src="/upload.js"></script>
</body>
</html>
